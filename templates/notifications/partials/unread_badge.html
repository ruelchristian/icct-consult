<!-- Notification Bell Fragment (with htmx live polling) -->
<a href="{% url 'notifications:list' %}" class="btn btn-ghost btn-circle btn-sm relative text-white hover:text-icct-yellow hover:bg-white/10" title="Notifications">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    {% if unread_notifications_count > 0 %}
        <span class="badge badge-xs bg-icct-red text-white font-bold absolute -top-1 -right-1 border-none animate-pulse px-1.5 py-1">
            {{ unread_notifications_count }}
        </span>
    {% endif %}
</a>
<span id="notif-sync-marker"
      data-count="{{ unread_notifications_count }}"
      data-title="{{ latest_unread.title|default:''|escapejs }}"
      data-msg="{{ latest_unread.message|default:''|truncatewords:15|escapejs }}"
      class="hidden">
</span>
<script>
    (function() {
        var marker = document.getElementById('notif-sync-marker');
        if (!marker) return;
        var count = parseInt(marker.getAttribute('data-count') || '0', 10);
        var title = marker.getAttribute('data-title');
        var msg = marker.getAttribute('data-msg');
        
        var prevCount = parseInt(sessionStorage.getItem('last_notif_count') || '0', 10);
        if (count > prevCount && count > 0 && title) {
            // Trigger browser notification if permission granted
            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    new Notification('ICCT: ' + title, {
                        body: msg,
                        icon: '/static/images/icons/icon-192x192.png',
                        badge: '/static/images/icons/icon-72x72.png'
                    });
                } catch(e) {}
            }
        }
        sessionStorage.setItem('last_notif_count', count);
    })();
</script>
