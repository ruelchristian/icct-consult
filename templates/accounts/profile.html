{% extends 'base.html' %}

{% block title %}User Profile - ICCT Consultations{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-6">
    <div class="card bg-white shadow-md border border-slate-200">
        <div class="card-body p-6">
            <h2 class="text-xl font-bold text-icct-navy mb-4">Account Profile</h2>

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label text-xs font-bold text-slate-700">First Name</label>
                        {{ form.first_name }}
                    </div>
                    <div>
                        <label class="label text-xs font-bold text-slate-700">Last Name</label>
                        {{ form.last_name }}
                    </div>
                </div>

                <div>
                    <label class="label text-xs font-bold text-slate-700">Email Address</label>
                    {{ form.email }}
                </div>

                <div>
                    <label class="label text-xs font-bold text-slate-700">Phone Number</label>
                    {{ form.phone_number }}
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn bg-icct-navy hover:bg-icct-blue text-white w-full">
                        Save Profile Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
