services:
  - type: web
    name: icct-consult
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: icct-consult-db
          property: connectionString

databases:
  - name: icct-consult-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
